<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOME DNA — цифровой паспорт недвижимости</title><style>
:root{--g:#153c37;--ink:#182b2b;--muted:#6e7b78;--gold:#c4a77a}*{box-sizing:border-box}body{margin:0;background:#e8eeeb;color:var(--ink);font:15px Inter,system-ui,sans-serif}.app{max-width:440px;min-height:100vh;margin:auto;background:#f7f7f3;box-shadow:0 10px 50px #193c3020}.page{padding:28px 24px 100px;min-height:100vh}.brand{font-size:13px;font-weight:800;letter-spacing:.2em;color:var(--g)}h1{font-size:28px;margin:12px 0 20px}h2{font-size:22px}.muted,.small{color:var(--muted)}.small{font-size:12px;line-height:1.5}.card,.item{background:white;border:1px solid #e4e9e5;border-radius:17px;padding:18px;margin:12px 0}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}.card.click{cursor:pointer}.card strong,.item strong{display:block;margin-bottom:6px}.btn{display:block;width:100%;background:var(--g);color:white;border:1px solid var(--g);border-radius:14px;padding:16px;text-align:left;font-size:14px;font-weight:600;cursor:pointer;margin:12px 0}.secondary{background:white;color:var(--g)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0;min-height:100px}.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:white;border-top:1px solid #ddd;padding:10px 4px}.nav button{border:0;background:transparent;padding:10px 0;font-size:11px;color:var(--muted);cursor:pointer}.nav button.active{color:var(--g);font-weight:800;background:#eaf2ee;border-radius:10px}.field{display:block;margin:18px 0;font-size:13px;font-weight:650}.field input,.field select,.field textarea{display:block;width:100%;margin-top:8px;border:1px solid #d9e3de;border-radius:12px;padding:14px;font:inherit;background:white}.field textarea{min-height:90px}.back{border:0;background:none;color:var(--g);padding:0;cursor:pointer;margin-bottom:18px}.hero{height:43vh;min-height:310px;background:linear-gradient(145deg,#153c37,#55756a 65%,#c4a77a);padding:65px 28px;color:white}.hero h1{font-size:54px;line-height:.95}.hero span{color:var(--gold)}.welcome{padding:28px}.welcome .btn{margin-top:50px}.pill{display:inline-block;background:#e8f0eb;color:var(--g);border-radius:20px;padding:8px;font-size:12px}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:20px 0 12px}.stat{font-size:30px;font-weight:800;color:var(--g)}@media(min-width:700px){.app{margin:30px auto;border-radius:24px;overflow:hidden}}
</style></head><body><main class="app" id="app"></main><script>
const KEY='home-dna-demo-v2',seed={properties:[{id:1,name:'Квартира на Остоженке',address:'Москва, Остоженка',area:96,year:2021}],active:1,docs:[{id:1,name:'План и техническая документация',category:'Планы',date:'18.09.2026'},{id:2,name:'Договоры и акты',category:'Договоры',date:'18.09.2026'},{id:3,name:'Гарантии и инструкции',category:'Гарантии',date:'12.10.2026'}],rooms:['Кухня','Гостиная','Спальня','Ванная'],equipment:[{id:1,name:'Кондиционер',room:'Гостиная',warranty:2028,contractor:'Сервисная компания'}],tasks:[{id:1,title:'Проверка вентиляции',date:'2026-11-09',status:'Выполнено'},{id:2,title:'Обслуживание кондиционера',date:'2026-11-24',status:'Запланировано'}],history:[{id:1,title:'Проверка вентиляции',date:'2026-11-09',note:'Плановое обслуживание'}],access:'Только владелец'};let d;try{d=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{d=structuredClone(seed)}let route=location.hash.slice(1)||'welcome',chosen=null;const app=document.getElementById('app'),save=()=>localStorage.setItem(KEY,JSON.stringify(d)),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),p=()=>d.properties.find(x=>x.id===d.active)||d.properties[0],go=r=>{location.hash=r;route=r;render();scrollTo(0,0)};addEventListener('hashchange',()=>{route=location.hash.slice(1)||'welcome';render()});const btn=(t,r,s=false)=>`<button class="btn ${s?'secondary':''}" onclick="go('${r}')">${t}</button>`,item=(t,s,r,id)=>`<div class="item" onclick="${id!==undefined?'chosen='+id+';':''}go('${r}')"><div><strong>${esc(t)}</strong><div class="small">${esc(s)}</div></div>›</div>`,field=(t,n,v='',type='text')=>`<label class="field">${t}<input required name="${n}" type="${type}" value="${esc(v)}"></label>`,form=(inner,fn)=>`<form onsubmit="${fn}(event)">${inner}<button class="btn">Сохранить →</button></form>`,nav=()=>`<nav class="nav">${[['objects','Объекты'],['home','Паспорт'],['calendar','Календарь'],['history','История']].map(([r,t])=>`<button class="${route===r?'active':''}" onclick="go('${r}')">${t}</button>`).join('')}</nav>`,shell=(title,body,back='home')=>`<section class="page"><button class="back" onclick="go('${back}')">← Назад</button><div class="brand">HOME DNA</div><h1>${title}</h1><hr style="border:0;border-top:1px solid #d8e0dc">${body}</section>${nav()}`;function render(){let h='',x;switch(route){
case 'welcome':h=`<div class="hero"><h1>HOME<br><span>DNA</span></h1></div><div class="welcome"><h2>Цифровой паспорт<br>вашей недвижимости</h2><p class="muted">Документы, оборудование, обслуживание и история дома — в одном пространстве.</p>${btn('Начать работу →','objects')}<p class="small">Демонстрационная версия · MVP</p></div>`;break;
case 'objects':h=shell('Мои объекты',`<div class="eyebrow">Объектов: ${d.properties.length}</div>${d.properties.map(q=>`<div class="card click" onclick="d.active=${q.id};save();go('home')"><strong>${esc(q.name)}</strong><p class="small">${esc(q.address)} · ${esc(q.area)} м²</p><span class="pill">Открыть паспорт →</span></div>`).join('')}${btn('＋ Добавить объект','new')}`,'welcome');break;
case 'new':h=shell('Новый объект',form(field('Название','name')+field('Адрес','address')+field('Площадь, м²','area','','number')+field('Год постройки','year','','number'),'addProperty'),'objects');break;
case 'home':h=shell('Паспорт объекта',`<div class="card"><div class="small">ЦИФРОВОЙ ПАСПОРТ</div><h2>${esc(p().name)}</h2><p class="small">${esc(p().address)} · ${esc(p().area)} м² · ${esc(p().year)} год</p><span class="pill">Паспорт активен</span></div><div class="grid">${[['Документы','docs'],['Комнаты и техника','rooms'],['Обслуживание','calendar'],['История объекта','history']].map(([t,r])=>`<div class="card click" onclick="go('${r}')"><strong>${t}</strong><span class="small">Открыть →</span></div>`).join('')}</div>${btn('Поделиться паспортом','share')}${btn('Редактировать объект','edit',true)}`,'objects');break;
case 'edit':h=shell('Редактировать объект',form(field('Название','name',p().name)+field('Адрес','address',p().address)+field('Площадь','area',p().area,'number')+field('Год','year',p().year,'number'),'editProperty'));break;
case 'docs':h=shell('Документы',`<div class="eyebrow">Документов: ${d.docs.length}</div>${d.docs.map(q=>item(q.name,q.category+' · '+q.date,'docdetail',q.id)).join('')}<label class="btn">＋ Загрузить документ<input type="file" hidden multiple onchange="uploadDoc(event)"></label><p class="small">Файлы хранятся в этом браузере, не на сервере. Максимум 1,5 МБ на файл.</p>`);break;
case 'docdetail':x=d.docs.find(q=>q.id===chosen)||d.docs[0];h=shell('Карточка документа',x?`<div class="card"><h2>${esc(x.name)}</h2><p>${esc(x.category)}</p><p class="small">Добавлен: ${esc(x.date)}</p></div>${x.content?`<button class="btn" onclick="downloadDoc(${x.id})">Скачать файл</button>`:''}<button class="btn secondary" onclick="removeDoc(${x.id})">Удалить документ</button>${btn('К документам','docs',true)}`:'Документ не найден','docs');break;
case 'rooms':h=shell('Комнаты и техника',`${d.rooms.map(r=>item(r,d.equipment.filter(q=>q.room===r).length+' ед. оборудования','item')).join('')}${btn('＋ Добавить комнату','newroom',true)}${btn('＋ Добавить оборудование','newequipment')}`);break;
case 'newroom':h=shell('Новая комната',form(field('Название','name'),'addRoom'),'rooms');break;
case 'item':h=shell('Оборудование',`${d.equipment.map(q=>item(q.name,q.room+' · гарантия '+q.warranty,'equipmentdetail',q.id)).join('')}${btn('＋ Добавить оборудование','newequipment')}`,'rooms');break;
case 'equipmentdetail':x=d.equipment.find(q=>q.id===chosen)||d.equipment[0];h=shell('Карточка оборудования',`<div class="card"><h2>${esc(x.name)}</h2><p>Комната: ${esc(x.room)}</p><p>Гарантия до: ${esc(x.warranty)}</p><p>Подрядчик: ${esc(x.contractor)}</p></div>${btn('Гарантии и инструкции','docs')}${btn('Запланировать обслуживание','newtask')}${btn('К оборудованию','item',true)}`,'item');break;
case 'newequipment':h=shell('Новое оборудование',form(field('Название','name')+`<label class="field">Комната<select name="room">${d.rooms.map(r=>`<option>${esc(r)}</option>`).join('')}</select></label>`+field('Гарантия до (год)','warranty','','number')+field('Подрядчик','contractor'),'addEquipment'),'item');break;
case 'calendar':h=shell('Обслуживание',`<div class="eyebrow">План работ</div>${d.tasks.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(q=>item(q.title,q.date+' · '+q.status,'work',q.id)).join('')}${btn('＋ Добавить задачу','newtask')}`);break;
case 'newtask':h=shell('Новая задача',form(field('Название работы','title')+field('Дата','date',new Date().toISOString().slice(0,10),'date')+`<label class="field">Статус<select name="status"><option>Запланировано</option><option>Выполнено</option></select></label>`,'addTask'),'calendar');break;
case 'work':x=d.tasks.find(q=>q.id===chosen)||d.tasks[0];h=shell('Запись о работе',`<div class="card"><strong>${esc(x.title)}</strong><p class="small">${esc(x.date)}</p></div>${form(`<label class="field">Статус<select name="status"><option ${x.status==='Запланировано'?'selected':''}>Запланировано</option><option ${x.status==='Выполнено'?'selected':''}>Выполнено</option></select></label><label class="field">Комментарий<textarea name="note">${esc(x.note||'')}</textarea></label>`,'saveWork')}${btn('История объекта','history',true)}`,'calendar');break;
case 'history':h=shell('История объекта',`${d.history.slice().reverse().map(q=>`<div class="card"><strong>${esc(q.title)}</strong><p class="small">${esc(q.date)}</p><p>${esc(q.note)}</p></div>`).join('')}${btn('Подготовить отчёт','share')}`);break;
case 'share':h=shell('Доступ и отчёт',`<div class="card"><strong>${esc(p().name)}</strong><p class="small">${esc(p().address)}</p></div>${item('Права доступа',d.access,'access')}${btn('Сформировать отчёт','report')}`);break;
case 'access':h=shell('Права доступа',`<div class="card small">В демоверсии это настройка интерфейса. Настоящие права доступа требуют серверной авторизации.</div>${form(`<label class="field">Уровень доступа<select name="access"><option ${d.access==='Только владелец'?'selected':''}>Только владелец</option><option ${d.access==='Покупатель (демо)'?'selected':''}>Покупатель (демо)</option></select></label>`,'saveAccess')}`,'share');break;
case 'report':h=shell('Отчёт покупателю',`<div class="card"><h2>${esc(p().name)}</h2><p>${esc(p().address)}</p><div class="grid">${[['Документы',d.docs.length],['Техника',d.equipment.length],['События',d.history.length],['Задачи',d.tasks.length]].map(([t,n])=>`<div><div class="stat">${n}</div><span class="small">${t}</span></div>`).join('')}</div></div><button class="btn" onclick="print()">Печать / сохранить PDF</button>${btn('Права доступа','access')}`,'share');break;
default:route='objects';render();return}app.innerHTML=h}
const values=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};function addProperty(e){let q={...values(e),id:Date.now()};d.properties.push(q);d.active=q.id;save();go('home')}function editProperty(e){Object.assign(p(),values(e));save();go('home')}function addRoom(e){d.rooms.push(values(e).name);save();go('rooms')}function addEquipment(e){d.equipment.push({...values(e),id:Date.now()});save();go('item')}function addTask(e){d.tasks.push({...values(e),id:Date.now()});save();go('calendar')}function saveWork(e){let v=values(e),t=d.tasks.find(q=>q.id===chosen)||d.tasks[0];Object.assign(t,v);if(t.status==='Выполнено'&&!d.history.some(q=>q.taskId===t.id))d.history.push({id:Date.now(),taskId:t.id,title:t.title,date:t.date,note:t.note||'Работа выполнена'});save();go('history')}function saveAccess(e){d.access=values(e).access;save();go('share')}function removeDoc(id){if(!confirm('Удалить документ?'))return;d.docs=d.docs.filter(q=>q.id!==id);save();go('docs')}function uploadDoc(e){for(const f of e.target.files){if(f.size>1500000){alert('Максимум 1,5 МБ на файл');continue}let reader=new FileReader();reader.onload=()=>{d.docs.push({id:Date.now()+Math.floor(Math.random()*10000),name:f.name,category:'Загруженный файл',date:new Date().toLocaleDateString('ru-RU'),content:reader.result});try{save();render()}catch{d.docs.pop();alert('Недостаточно места в браузере')}};reader.readAsDataURL(f)}}function downloadDoc(id){let q=d.docs.find(x=>x.id===id);if(q?.content){let a=document.createElement('a');a.href=q.content;a.download=q.name;a.click()}}render();
</script></body></html>
